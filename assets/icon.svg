<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12131C"/>
      <stop offset="50%" stop-color="#090A10"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Glass Rim Highlight Stroke -->
    <linearGradient id="rimGrad" x1="120" y1="40" x2="392" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Central Luminous Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Moon-Note Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="140" y1="120" x2="380" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="28%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="85%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Specular Highlight for Ribbon Inner Ridge -->
    <linearGradient id="specularGlow" x1="160" y1="130" x2="260" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#DDD6FE" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7C3AED" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Ambient Light Diffusion -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)"/>

  <!-- Glowing Emblem: Celestial Crescent Moon Fused with Musical Note -->
  <g filter="url(#glowShadow)">
    <!-- Crescent Moon sweeping around to musical note stem -->
    <!-- The outer crescent curves from upper right (360, 150) down through left (148, 256) -->
    <!-- and sweeps into the musical notehead at bottom center-right (275, 345) -->
    <path d="M 320 128
             C 215 120 142 195 142 276
             C 142 352 205 400 274 394
             C 335 388 376 342 368 288
             C 362 250 328 226 292 232
             C 260 237 236 264 240 294
             C 244 322 270 338 296 332
             C 310 328 322 316 325 304
             C 328 290 320 276 308 274
             C 298 272 290 280 292 290
             C 293 296 298 300 304 298
             C 280 306 264 292 262 274
             C 258 246 282 220 316 216
             C 358 210 398 242 404 290
             C 412 362 355 422 272 426
             C 180 430 110 366 110 268
             C 110 166 198 88 326 94
             C 342 95 358 98 372 104
             C 354 112 336 120 320 128 Z"
          fill="url(#ribbonGrad)"/>

    <!-- Specular Crest Reflection on the Moon's Slender Peak -->
    <path d="M 330 102
             C 220 106 132 176 128 270
             C 126 290 130 312 138 332
             C 130 308 126 284 128 260
             C 134 176 216 114 316 110
             C 334 109 352 112 368 118
             C 356 112 344 106 330 102 Z"
          fill="url(#specularGlow)"/>

    <!-- Luminous Note Flag Arc (upper wave echo) -->
    <path d="M 318 138
             C 360 148 392 186 398 232
             C 400 248 398 264 394 278
             C 398 260 398 244 394 230
             C 388 188 358 154 318 138 Z"
          fill="#38BDF8"
          opacity="0.85"/>
  </g>

  <!-- Tiny Ethereal Starlight Sparkle on the Crescent Tip -->
  <circle cx="366" cy="106" r="3.5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="366" cy="106" r="9" fill="#38BDF8" opacity="0.4"/>
</svg>
